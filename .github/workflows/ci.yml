name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Instalación como uv tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Construir, instalar con uv tool y ejecutar doctor, un ejemplo y un proyecto
        run: uv run --no-project --python 3.12 python scripts/smoke_install.py
