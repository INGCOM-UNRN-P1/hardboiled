name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  # El estilo va aparte: dentro de la matriz, una línea larga dejaba sin correr los tests de los
  # tres sistemas, sin que se notara qué pasaba en Windows.
  estilo:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  web:
    name: Panel web con Chromium y firmware RV32I
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group browser
      - run: uv run --group browser playwright install --with-deps chromium
      - name: SPA, teclado, LCD, RGB, foco, recarga y pantalla móvil
        env:
          HARDBOILED_BROWSER: "1"
          HARDBOILED_SCREENSHOT: panel_desktop.png
        run: uv run --group browser python -m pytest tests/test_web_browser.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: panel-web
          path: panel_*.png

  package:
    name: Instalación como uv tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Construir, instalar con uv tool y ejecutar doctor, un ejemplo y un proyecto
        run: uv run --no-project --python 3.12 python scripts/smoke_install.py

  calidad:
    name: Errores de Python y dependencias vulnerables
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Solo reglas que indican errores reales: sintaxis (E9), comparaciones
      # inválidas (F63), sentencias fuera de lugar (F7) y nombres indefinidos (F82).
      - name: Errores de Python (ruff E9, F63, F7, F82)
        run: uvx ruff check --select E9,F63,F7,F82 .

      - name: Dependencias con vulnerabilidades conocidas (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --all-extras --all-groups > "$RUNNER_TEMP/requisitos.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requisitos.txt" --disable-pip --no-deps
