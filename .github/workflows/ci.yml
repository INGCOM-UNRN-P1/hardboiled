name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  package:
    name: Instalación como uv tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Construir, instalar con uv tool y ejecutar doctor, un ejemplo y un proyecto
        run: uv run --no-project --python 3.12 python scripts/smoke_install.py

  calidad:
    name: Errores de Python y dependencias vulnerables
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Solo reglas que indican errores reales: sintaxis (E9), comparaciones
      # inválidas (F63), sentencias fuera de lugar (F7) y nombres indefinidos (F82).
      - name: Errores de Python (ruff E9, F63, F7, F82)
        run: uvx ruff check --select E9,F63,F7,F82 .

      - name: Dependencias con vulnerabilidades conocidas (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --all-extras --all-groups > "$RUNNER_TEMP/requisitos.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requisitos.txt" --disable-pip --no-deps
