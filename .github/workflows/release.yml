name: Verificar el release

# Se dispara al empujar un tag vX.Y.Z. hardboiled no se publica en PyPI: se instala con
# `uv tool install` desde el repositorio (decisión de la cátedra), así que este workflow
# solo comprueba que el tag coincida con la versión, que la instalación como uv tool funcione
# y que el paquete se construya; el wheel queda como artefacto del run.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Construir y verificar
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: El tag coincide con la versión del paquete
        run: |
          version=$(uv run --no-project --python 3.12 python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "el tag ${GITHUB_REF_NAME} no coincide con la versión ${version}"; exit 1; }
      - name: Instalación como uv tool
        run: uv run --no-project --python 3.12 python scripts/smoke_install.py
      - name: Construir sdist y wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
