name: Publicar en PyPI

# Se dispara al empujar un tag vX.Y.Z. Requiere configurar una sola vez el
# "trusted publisher" en PyPI (ver docs/publicar.md); no usa tokens.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Construir y verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: El tag coincide con la versión del paquete
        run: |
          version=$(uv run --no-project --python 3.12 python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "el tag ${GITHUB_REF_NAME} no coincide con la versión ${version}"; exit 1; }
      - name: Instalación como uv tool
        run: uv run --no-project --python 3.12 python scripts/smoke_install.py
      - name: Construir sdist y wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always dist/*
