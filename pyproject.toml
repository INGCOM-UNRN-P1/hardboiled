[project]
name = "hardboiled"
version = "1.0.0"
description = "Emulador pedagógico RV32I bare-metal con depurador de código C, MMIO e interrupciones en una TUI"
readme = "README.md"
authors = [
    { name = "Martín René", email = "martinvilu@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["risc-v", "rv32i", "emulator", "debugger", "education", "embedded", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Emulators",
]
dependencies = [
    "pydantic>=2",
    "pyelftools>=0.33",
    "textual>=8.2.8",
    "unicorn>=2.1.4",
]

[project.optional-dependencies]
# Compilador C para riscv32 sin toolchain del sistema: `python -m ziglang cc`.
# Queda en el mismo entorno aislado que la herramienta (uv tool install "hardboiled[zig]").
zig = ["ziglang>=0.16.0"]

[project.scripts]
hardboiled = "hardboiled.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    # Compila los fixtures de los tests (mismo paquete que el extra [zig]).
    "ziglang>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["elftools.*"]
ignore_missing_imports = true

# La binding de Unicorn declara py.typed pero no anota sus métodos ni sus reexports.
[[tool.mypy.overrides]]
module = ["unicorn", "unicorn.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["hardboiled.core.cpu", "hardboiled.doctor"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
